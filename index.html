<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aeternum</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --cream: #f6e7c9;
    --sunrise: #e8894a;
    --ember: #b4512e;
    --ink: #070508;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(180deg,
      #000000 0%, #070508 58%, #1a0b16 72%,
      #3d1524 80%, #7a2d1e 88%, #b4512e 95%, #cf7a44 100%);
    color: var(--cream);
    font-family: Georgia, 'Times New Roman', serif;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
  }
  body.dragging { cursor: grabbing; }
  body.paged { cursor: default; }

  /* fades in with the zoom: on pages the gradient is the same palette
     polarised to black and plum. No orange enters the equation. */
  #darken {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: linear-gradient(180deg,
      #000000 0%, #000000 58%,
      #0a050c 72%,
      #1a0b16 84%,
      #2b1020 94%,
      #3d1524 100%);
  }

  /* third level deep: the background completes its fade to pure black */
  #blackout { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; }

  /* distant sibling rings drifting through the deep */
  /* screen blend: drifters may only ever ADD light — over the sunset they wash out
     instead of flipping into dark silhouettes */
  #driftlayer { position: fixed; inset: 0; pointer-events: none; mix-blend-mode: screen; }
  .drift { position: absolute; }
  .drift div {
    position: absolute; left: 50%; top: 50%;
    width: 100%; height: 34%;
    border: 1px solid rgba(246, 231, 201, 0.5);
    border-radius: 50%;
  }
  .drift div:first-child {
    transform: translate(-50%, -50%) rotate(14deg);
    animation: driftSway var(--dur, 8s) ease-in-out var(--del, 0s) infinite;
  }
  .drift div:last-child  {
    transform: translate(-50%, -50%) rotate(-14deg); border-color: rgba(246, 231, 201, 0.3);
    animation: driftSway2 var(--dur, 8s) ease-in-out var(--del, 0s) infinite;
  }
  @keyframes driftSway {
    0%, 100% { transform: translate(-50%, -50%) rotate(16deg); }
    50%      { transform: translate(-50%, -50%) rotate(-16deg); }
  }
  /* mirrored, not reversed: a symmetric rock played backwards is the same motion */
  @keyframes driftSway2 {
    0%, 100% { transform: translate(-50%, -50%) rotate(-16deg); }
    50%      { transform: translate(-50%, -50%) rotate(16deg); }
  }

  #scene { position: fixed; inset: 0; }

  .wordmark {
    position: fixed; left: 50%; top: 44%;
    transform: translate(-50%, -50%);
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(3rem, 9vw, 7.5rem);
    font-style: italic; letter-spacing: 0.04em; font-weight: 600;
    z-index: 30; pointer-events: none;
    text-shadow: 0 0 24px rgba(0, 0, 0, 0.9), 0 0 80px rgba(232, 137, 74, 0.45);
  }
  .scrim {
    position: fixed; left: 50%; top: 45%;
    transform: translate(-50%, -50%);
    width: min(72vw, 60rem); height: min(38vh, 22rem);
    background: radial-gradient(ellipse closest-side, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0.35) 55%, transparent 100%);
    z-index: 20; pointer-events: none;
  }
  .tagline {
    position: fixed; left: 50%; top: calc(44% + clamp(2.2rem, 6vw, 5rem));
    transform: translateX(-50%);
    font-size: clamp(0.8rem, 1.4vw, 1.05rem);
    font-style: italic; opacity: 0.65; letter-spacing: 0.12em;
    z-index: 30; pointer-events: none; white-space: nowrap;
  }

  /* the centre of a satellite hub: the satellite's own wordmark and lede */
  .subwordmark {
    position: fixed; left: 50%; top: 52%;
    transform: translate(-50%, -50%);
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(1.8rem, 4.6vw, 3.6rem);
    font-style: italic; font-weight: 600; letter-spacing: 0.04em;
    z-index: 30; pointer-events: none; white-space: nowrap;
    opacity: 0;
    text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 60px rgba(232, 137, 74, 0.4);
  }
  .subtagline {
    position: fixed; left: 50%; top: calc(52% + clamp(1.6rem, 3.4vw, 2.8rem));
    transform: translateX(-50%);
    width: min(34rem, 80vw); text-align: center;
    font-style: italic; font-size: clamp(0.78rem, 1.3vw, 1rem); line-height: 1.5;
    opacity: 0; letter-spacing: 0.08em;
    z-index: 30; pointer-events: none;
  }

  .ring, .ring2 {
    position: absolute; left: 50%;
    border: 12px solid rgba(246, 231, 201, 0.85);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    box-shadow:
      0 0 22px rgba(232, 137, 74, 0.45),
      0 0 60px rgba(232, 137, 74, 0.18),
      inset 0 0 22px rgba(232, 137, 74, 0.3);
  }
  .ring2 { border-color: rgba(246, 231, 201, 0.55); }
  /* the satellite's own ring is finer */
  .subring, .subring2 {
    position: absolute; left: 50%;
    border: 5px solid rgba(246, 231, 201, 0.8);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none; opacity: 0;
    box-shadow:
      0 0 16px rgba(232, 137, 74, 0.4),
      0 0 40px rgba(232, 137, 74, 0.15),
      inset 0 0 16px rgba(232, 137, 74, 0.25);
  }
  .subring2 { border-color: rgba(246, 231, 201, 0.5); }

  .node { position: absolute; text-align: center; cursor: pointer; }
  .node .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--cream);
    margin: 0 auto 8px;
    box-shadow: 0 0 12px rgba(246, 231, 201, 0.8);
  }
  .node .label {
    font-size: var(--label-size, 1rem); letter-spacing: 0.22em; text-transform: uppercase;
    font-family: Georgia, serif; white-space: nowrap;
    transition: text-shadow 0.25s;
  }
  .node:hover .label { text-shadow: 0 0 18px rgba(246, 231, 201, 0.9); }
  .node.subnode .dot { width: 7px; height: 7px; }
  .node.subnode .label { font-size: calc(var(--label-size, 1rem) * 0.78); }

  #front-desc {
    position: fixed; left: 50%; top: 78%;
    transform: translateX(-50%);
    width: min(34rem, 82vw);
    text-align: center; z-index: 30; pointer-events: none;
    color: var(--cream);
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6);
  }
  #front-desc .name {
    font-size: 1.25rem; letter-spacing: 0.3em; text-transform: uppercase;
    margin-bottom: 0.5rem; font-weight: bold;
  }
  #front-desc .desc { font-style: italic; font-size: 1rem; line-height: 1.5; opacity: 0.85; }


  /* phones: smaller title, tighter chrome, room for the rounder orbit */
  @media (max-width: 520px) {
    .wordmark { font-size: 2.1rem; }
    .tagline { font-size: 0.68rem; top: calc(44% + 1.9rem); }
    .subwordmark { font-size: 1.5rem; }
    .subtagline { font-size: 0.72rem; top: calc(52% + 1.4rem); }
    #front-desc .name { font-size: 0.95rem; }
    #front-desc .desc { font-size: 0.85rem; }
    .page-inner { padding-top: 24vh; }
    .page-inner h1 { font-size: 2rem; }
  }

  /* ---------- content pages ---------- */
  #page {
    position: fixed; inset: 0; z-index: 25;
    overflow-y: auto;
    opacity: 0; pointer-events: none;
  }
  .page-inner {
    max-width: 44rem;
    margin: 0 auto;
    padding: 30vh 1.5rem 6rem;
  }
  .page-inner h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic; font-weight: 600;
    font-size: clamp(2.4rem, 6vw, 4.2rem);
    margin-bottom: 1.2rem;
    text-shadow: 0 0 40px rgba(232, 137, 74, 0.35);
  }
  .page-lede {
    font-style: italic; font-size: 1.15rem; line-height: 1.65;
    opacity: 0.9; margin-bottom: 2rem;
  }
  .page-body p { line-height: 1.85; margin-bottom: 1.3rem; opacity: 0.78; }
  .page-nav {
    display: flex; justify-content: space-between;
    margin-top: 4.5rem;
    font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase;
  }
  .page-nav a { color: var(--cream); text-decoration: none; opacity: 0.7; }
  .page-nav a:hover { opacity: 1; }

  /* the arc overhead is always the way back up one level */
  #ringzone {
    position: fixed; top: 0; left: 0; right: 0; height: 30vh;
    z-index: 45; cursor: pointer; pointer-events: none;
  }

  /* ---------- listings ---------- */
  .member { margin-bottom: 1.1rem; }
  .member .m-name { letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.95rem; }
  .member .m-name a { color: var(--cream); text-decoration: none; transition: text-shadow 0.25s; }
  .member .m-name a:hover { text-shadow: 0 0 16px rgba(246, 231, 201, 0.9); }
  .member .m-tag { opacity: 0.5; font-size: 0.8em; margin-right: 0.15em; }
  .member .m-legal { opacity: 0.45; font-size: 0.8em; text-transform: none; letter-spacing: 0.05em; font-style: italic; }
  .member .m-status { font-style: italic; opacity: 0.6; font-size: 0.9rem; }

  .proj {
    border: 2px solid rgba(246, 231, 201, 0.42);
    border-radius: 6px;
    padding: 1.3rem 1.5rem;
    margin-bottom: 1.4rem;
    background: rgba(0, 0, 0, 0.25);
    display: flex; gap: 1.3rem; align-items: flex-start;
    /* cards run 75% wider than the text column, centred */
    width: min(175%, 88vw);
    margin-left: 50%; transform: translateX(-50%);
  }
  @media (max-width: 900px) { .proj { width: 100%; } }
  .p-media {
    flex: 0 0 78px; height: 78px;
    border: 1px solid rgba(246, 231, 201, 0.25); border-radius: 8px;
    background: rgba(0, 0, 0, 0.35);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  .p-media img { width: 100%; height: 100%; object-fit: cover; }
  /* until a logo is uploaded: a faint resting emblem */
  .p-media-ph { position: relative; width: 44px; height: 44px; }
  .p-media-ph div {
    position: absolute; left: 0; right: 0; top: 31%; height: 38%;
    border: 1px solid rgba(246, 231, 201, 0.35); border-radius: 50%;
  }
  .p-media-ph div:first-child { transform: rotate(16deg); }
  .p-media-ph div:last-child  { transform: rotate(-16deg); border-color: rgba(246, 231, 201, 0.2); }
  .p-inner { flex: 1; min-width: 0; }
  .proj .p-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.4rem; }
  .proj .p-name { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 1.3rem; }
  .proj .p-cat { font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.5; }
  .proj .p-desc { line-height: 1.7; opacity: 0.75; margin-top: 0.6rem; }
  .p-toggle {
    background: none; border: none; cursor: pointer;
    color: var(--cream); opacity: 0.6;
    font-family: Georgia, serif; font-size: 0.72rem;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 0; margin-top: 0.9rem;
  }
  .p-toggle:hover { opacity: 1; }
  .p-more {
    margin-top: 0.9rem; padding-top: 0.9rem;
    border-top: 1px solid rgba(246, 231, 201, 0.15);
    line-height: 1.75; opacity: 0.72; font-size: 0.95rem;
    white-space: pre-line;
  }
  .proj a { color: var(--sunrise); text-decoration: none; }
  .proj a:hover { text-decoration: underline; }
  .p-links { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.9rem; }
  .p-links a {
    border: 1px solid rgba(246, 231, 201, 0.4); border-radius: 999px;
    padding: 0.3rem 0.95rem;
    font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--cream); text-decoration: none;
    transition: box-shadow 0.25s, border-color 0.25s;
  }
  .p-links a:hover { border-color: var(--cream); box-shadow: 0 0 14px rgba(232, 137, 74, 0.35); text-decoration: none; }
  .p-progress { margin-top: 0.95rem; height: 4px; background: rgba(246, 231, 201, 0.15); border-radius: 999px; overflow: hidden; }
  .p-progress div { height: 100%; background: linear-gradient(90deg, var(--ember), var(--sunrise)); }
  .p-progress-note { font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5; margin-top: 0.4rem; }

  /* ---------- portal: chat + news ---------- */
  .portal input {
    width: 100%;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(246, 231, 201, 0.28);
    border-radius: 4px;
    color: var(--cream);
    font-family: Georgia, serif; font-size: 1rem;
    padding: 0.65rem 0.8rem;
    outline: none;
  }
  .portal input:focus { border-color: rgba(246, 231, 201, 0.7); }
  .portal .pbtn {
    background: none; cursor: pointer;
    border: 1px solid rgba(246, 231, 201, 0.5);
    border-radius: 999px;
    color: var(--cream);
    font-family: Georgia, serif;
    font-size: 0.78rem; letter-spacing: 0.22em; text-transform: uppercase;
    padding: 0.7rem 1.8rem;
    transition: box-shadow 0.25s, border-color 0.25s;
  }
  .portal .pbtn:hover { border-color: var(--cream); box-shadow: 0 0 24px rgba(232, 137, 74, 0.35); }
  .portal .pbtn[disabled] { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
  .portal-login { max-width: 26rem; }
  .portal-login .pbtn { margin-top: 1.2rem; }
  .pstatus { font-style: italic; font-size: 0.85rem; opacity: 0.7; margin-top: 0.8rem; }
  .psignout { font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.5; cursor: pointer; background: none; border: none; color: var(--cream); padding: 0; margin-bottom: 1.2rem; }
  .psignout:hover { opacity: 1; }

  /* ---------- the dashboard shell (once inside the portal) ---------- */
  .dash {
    display: flex;
    /* near-fullscreen: the workspace owns the viewport while the portal is open */
    position: fixed; top: 3.5vh; left: 3vw; right: 3vw; bottom: 3.5vh;
    z-index: 46;   /* above the arc and its exit zone */
    border: 2px solid rgba(246, 231, 201, 0.35);
    border-radius: 10px;
    background: #000;
    overflow: hidden;
  }
  .dash-side {
    width: 200px; flex: 0 0 200px;
    display: flex; flex-direction: column;
    border-right: 1px solid rgba(246, 231, 201, 0.15);
    background: rgba(0, 0, 0, 0.35);
    padding-top: 1.2rem;
  }
  .dash-brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic; font-weight: 600; font-size: 1.15rem;
    text-align: center; margin-bottom: 1.4rem;
    text-shadow: 0 0 24px rgba(232, 137, 74, 0.35);
  }
  .dash-nav { display: flex; flex-direction: column; }
  .dash-nav button {
    text-align: left; background: none; border: none; cursor: pointer;
    color: var(--cream); opacity: 0.55;
    font-family: Georgia, serif; font-size: 0.72rem;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 0.85rem 1.3rem;
    border-left: 2px solid transparent;
  }
  .dash-nav button:hover { opacity: 0.9; }
  .dash-nav button.active {
    opacity: 1;
    border-left-color: var(--sunrise);
    background: rgba(246, 231, 201, 0.05);
  }
  .dash-side { overflow-y: auto; }
  .grp-h {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.7rem 1.3rem 0.25rem;
    font-size: 0.58rem; letter-spacing: 0.24em; text-transform: uppercase;
    opacity: 0.4; cursor: pointer;
  }
  .grp-h:hover { opacity: 0.8; }
  .grp.closed .grp-b { display: none; }
  .dash-nav button.sub { padding: 0.5rem 1.3rem 0.5rem 1.7rem; font-size: 0.66rem; }
  .pdot {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--cream); opacity: 0.75; margin-right: 0.5rem; vertical-align: middle;
    box-shadow: 0 0 5px rgba(246, 231, 201, 0.8);
  }
  .pdot.director { background: #c05a86; box-shadow: 0 0 6px rgba(192, 90, 134, 0.9); }
  .newchat-form label { display: block; font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.65; margin: 1.1rem 0 0.4rem; }
  .newchat-form .pick { display: block; margin: 0.35rem 0; font-size: 0.85rem; opacity: 0.8; cursor: pointer; }
  .newchat-form input[type="checkbox"] { accent-color: var(--sunrise); margin-right: 0.6rem; }

  .dash-user {
    margin-top: auto;
    padding: 1rem 1.3rem;
    border-top: 1px solid rgba(246, 231, 201, 0.12);
    font-size: 0.72rem;
  }
  .dash-user .du-h { letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.35rem; }
  .dash-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .dash-head {
    padding: 0.95rem 1.5rem;
    border-bottom: 1px solid rgba(246, 231, 201, 0.15);
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic; font-size: 1.05rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .dash-close {
    background: none; border: none; cursor: pointer;
    color: var(--cream); opacity: 0.5;
    font-family: Georgia, serif; font-size: 1.25rem; line-height: 1;
    padding: 0 0 0 1rem;
    transition: opacity 0.2s, text-shadow 0.2s;
  }
  .dash-close:hover { opacity: 1; text-shadow: 0 0 12px rgba(232, 137, 74, 0.6); }
  .dash-body { flex: 1; overflow-y: auto; padding: 1.2rem 1.5rem; }
  .dash-foot {
    display: flex; gap: 0.7rem;
    padding: 0.9rem 1.5rem;
    border-top: 1px solid rgba(246, 231, 201, 0.15);
  }
  .dash-foot input { flex: 1; }
  .dash .chat-log { max-height: none; margin-bottom: 0; }
  @media (max-width: 800px) {
    .dash { flex-direction: column; top: 2vh; left: 2vw; right: 2vw; bottom: 2vh; }
    .dash-side {
      width: 100%; flex: 0 0 auto;
      max-height: 34%; overflow-y: auto;
      border-right: none; border-bottom: 1px solid rgba(246, 231, 201, 0.15);
      padding-top: 0.6rem;
    }
    .dash-brand { display: none; }
    .dash-user { margin-top: 0.3rem; padding: 0.55rem 1.3rem; }
  }

  .chat-pinned {
    border: 1px solid rgba(232, 137, 74, 0.55); border-radius: 6px;
    padding: 0.75rem 1rem; margin-bottom: 1rem;
    background: rgba(0, 0, 0, 0.35); font-size: 0.92rem;
  }
  .chat-log { display: flex; flex-direction: column; gap: 0.7rem; max-height: 48vh; overflow-y: auto; padding-right: 0.4rem; margin-bottom: 1rem; }
  .msg .m-h { display: flex; gap: 0.55rem; align-items: baseline; flex-wrap: wrap; }
  .msg .m-handle { letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.78rem; }
  /* rank as orbits: member is a point of light, executive gains a ring,
     the director carries the crossed rings of the emblem itself */
  .rb { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.58rem; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.7; }
  .rb-orb { position: relative; width: 15px; height: 15px; flex: 0 0 15px; }
  .rb-orb::before {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px;
    border-radius: 50%; background: var(--cream);
    box-shadow: 0 0 6px rgba(246, 231, 201, 0.9);
  }
  .rb-orb::after, .rb-orb i {
    content: ''; position: absolute; left: 0; right: 0; top: 32%; height: 36%;
    border: 1px solid rgba(246, 231, 201, 0.7); border-radius: 50%;
    display: none;
  }
  .rb.executive { opacity: 0.95; }
  .rb.executive .rb-orb::after { display: block; transform: rotate(14deg); }
  /* the director wears the gradient's plum, lifted to luminosity (#3d1524 at full glow) */
  .rb.director { color: #c05a86; opacity: 1; text-shadow: 0 0 10px rgba(192, 90, 134, 0.5); }
  .rb.director .rb-orb::before { background: #c05a86; box-shadow: 0 0 8px rgba(192, 90, 134, 1); }
  .rb.director .rb-orb::after { display: block; transform: rotate(16deg); border-color: rgba(192, 90, 134, 0.95); }
  .rb.director .rb-orb i { display: block; transform: rotate(-16deg); border-color: rgba(192, 90, 134, 0.55); }
  /* the resident intelligence wears the ember orbit */
  .rb.claude { color: var(--sunrise); opacity: 1; text-shadow: 0 0 10px rgba(232, 137, 74, 0.45); }
  .rb.claude .rb-orb::before { background: var(--sunrise); box-shadow: 0 0 8px rgba(232, 137, 74, 1); }
  .rb.claude .rb-orb::after { display: block; transform: rotate(16deg); border-color: rgba(232, 137, 74, 0.95); }
  .rb.claude .rb-orb i { display: block; transform: rotate(-16deg); border-color: rgba(232, 137, 74, 0.55); }
  .msg .m-time { font-size: 0.62rem; opacity: 0.4; }
  .msg .m-text { opacity: 0.85; line-height: 1.55; }
  .msg .m-act { font-size: 0.6rem; opacity: 0.4; cursor: pointer; letter-spacing: 0.15em; text-transform: uppercase; background: none; border: none; color: var(--cream); padding: 0; margin-left: 0.6rem; }
  .msg .m-act:hover { opacity: 1; }
  .chat-input { display: flex; gap: 0.7rem; }
  .chat-input input { flex: 1; }

  .news-item {
    border: 1px solid rgba(246, 231, 201, 0.3); border-radius: 6px;
    padding: 1rem 1.2rem; margin-bottom: 1rem; background: rgba(0, 0, 0, 0.25);
  }
  .news-item .n-title { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 1.1rem; }
  .news-item .n-meta { font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.45; margin-top: 0.25rem; }
  .news-item .n-summary { line-height: 1.65; opacity: 0.78; margin-top: 0.55rem; font-size: 0.95rem; }
  .news-item .n-why { font-style: italic; opacity: 0.6; margin-top: 0.5rem; font-size: 0.9rem; }
  .news-item a { color: var(--sunrise); text-decoration: none; }
  .news-item a:hover { text-decoration: underline; }

  /* ---------- coming soon card: a gold mail stamp ---------- */
  .stamp {
    padding: 11px;
    background: var(--cream);
    /* perforated edge: a tiled row of punched holes rides the outer boundary;
       the second mask layer keeps the interior solid */
    -webkit-mask-image: radial-gradient(circle 5px at 8px 8px, transparent 98%, #000), linear-gradient(#000 0 0);
    -webkit-mask-size: 16px 16px, calc(100% - 10px) calc(100% - 10px);
    -webkit-mask-position: -8px -8px, 5px 5px;
    -webkit-mask-repeat: round, no-repeat;
    mask-image: radial-gradient(circle 5px at 8px 8px, transparent 98%, #000), linear-gradient(#000 0 0);
    mask-size: 16px 16px, calc(100% - 10px) calc(100% - 10px);
    mask-position: -8px -8px, 5px 5px;
    mask-repeat: round, no-repeat;
  }
  .coming {
    background: #000;
    padding: 3.2rem 1.5rem;
    text-align: center;
  }
  .coming .c-orbits { position: relative; width: 70px; height: 70px; margin: 0 auto 1.5rem; }
  .coming .c-orbits div {
    position: absolute; left: 0; right: 0; top: 31%; height: 38%;
    border: 1px solid rgba(246, 231, 201, 0.65);
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(232, 137, 74, 0.3);
  }
  .coming .c-orbits div:first-child { animation: comingSway 7s ease-in-out infinite; }
  .coming .c-orbits div:last-child  { animation: comingSway 7s ease-in-out infinite reverse; border-color: rgba(246, 231, 201, 0.35); }
  @keyframes comingSway { 0%, 100% { transform: rotate(16deg); } 50% { transform: rotate(-16deg); } }
  .coming .c-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic; font-weight: 600; font-size: 1.7rem;
    letter-spacing: 0.04em;
    text-shadow: 0 0 30px rgba(232, 137, 74, 0.4);
  }
  .coming .c-sub { font-style: italic; opacity: 0.5; margin-top: 0.55rem; font-size: 0.9rem; }

  /* ---------- application form ---------- */
  .frow { display: flex; gap: 0.9rem; flex-wrap: wrap; }
  .frow > div { flex: 1; min-width: 10rem; }
  form.apply select {
    width: 100%;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(246, 231, 201, 0.28);
    border-radius: 4px;
    color: var(--cream);
    font-family: Georgia, serif; font-size: 1rem;
    padding: 0.65rem 0.8rem;
    outline: none;
  }
  form.apply select:focus { border-color: rgba(246, 231, 201, 0.7); }
  form.apply option { background: #14090f; color: var(--cream); }
  form.apply input[type="date"] { color-scheme: dark; }
  form.apply input[type="range"] { accent-color: var(--sunrise); padding: 0; }
  .rangeval { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 1.1rem; margin-left: 0.8rem; }
  .projrow { display: flex; gap: 0.9rem; margin-bottom: 0.7rem; flex-wrap: wrap; }
  .projrow input { flex: 1; min-width: 9rem; }
  .addbtn {
    background: none; cursor: pointer;
    border: 1px dashed rgba(246, 231, 201, 0.4);
    border-radius: 4px;
    color: var(--cream); opacity: 0.75;
    font-family: Georgia, serif; font-size: 0.78rem;
    letter-spacing: 0.18em; text-transform: uppercase;
    padding: 0.55rem 1.1rem; margin-top: 0.2rem;
  }
  .addbtn:hover { opacity: 1; border-style: solid; }
  .prompt { font-style: italic; opacity: 0.7; line-height: 1.6; margin-bottom: 0.7rem; font-size: 0.95rem; }
  .vstatus { font-style: italic; font-size: 0.85rem; opacity: 0.7; margin-left: 0.9rem; }
  form.apply button[disabled] { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
  .wordcount { text-align: right; font-size: 0.75rem; letter-spacing: 0.15em; opacity: 0.55; margin-top: 0.4rem; }
  form.apply label {
    display: block; font-size: 0.72rem; letter-spacing: 0.22em;
    text-transform: uppercase; opacity: 0.7; margin: 1.4rem 0 0.45rem;
  }
  form.apply input, form.apply textarea {
    width: 100%;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(246, 231, 201, 0.28);
    border-radius: 4px;
    color: var(--cream);
    font-family: Georgia, serif; font-size: 1rem;
    padding: 0.65rem 0.8rem;
    outline: none;
  }
  form.apply input:focus, form.apply textarea:focus { border-color: rgba(246, 231, 201, 0.7); }
  form.apply textarea { min-height: 7.5rem; resize: vertical; }
  form.apply button {
    margin-top: 1.8rem;
    background: none; cursor: pointer;
    border: 1px solid rgba(246, 231, 201, 0.5);
    border-radius: 999px;
    color: var(--cream);
    font-family: Georgia, serif;
    font-size: 0.8rem; letter-spacing: 0.25em; text-transform: uppercase;
    padding: 0.8rem 2.2rem;
    transition: box-shadow 0.25s, border-color 0.25s;
  }
  form.apply button:hover {
    border-color: var(--cream);
    box-shadow: 0 0 24px rgba(232, 137, 74, 0.35);
  }
  .form-note { font-style: italic; font-size: 0.85rem; opacity: 0.55; margin-top: 1rem; }
</style>
</head>
<body>

<div class="scrim"></div>

<div class="subwordmark"></div>
<div class="subtagline"></div>
<div id="scene"></div>
<div id="front-desc"><div class="name"></div><div class="desc"></div></div>

<div id="page"><div class="page-inner">
