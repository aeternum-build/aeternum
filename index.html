<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aeternum</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/aeternum-32.png">
<link rel="apple-touch-icon" href="/assets/aeternum-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --cream: #f6e7c9;
    --sunrise: #e8894a;
    --ember: #b4512e;
    --ink: #070508;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(180deg,
      #000000 0%, #070508 58%, #1a0b16 72%,
      #3d1524 80%, #7a2d1e 88%, #b4512e 95%, #cf7a44 100%);
    color: var(--cream);
    font-family: Georgia, 'Times New Roman', serif;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
  }
  body.dragging { cursor: grabbing; }
  body.paged { cursor: default; }

  /* fades in with the zoom: on pages the gradient is the same palette
     polarised to black and plum. No orange enters the equation. */
  #darken {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: linear-gradient(180deg,
      #000000 0%, #000000 58%,
      #0a050c 72%,
      #1a0b16 84%,
      #2b1020 94%,
      #3d1524 100%);
  }

  /* third level deep: the background completes its fade to pure black */
  #blackout { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; }

  /* distant sibling rings drifting through the deep */
  /* screen blend: drifters may only ever ADD light — over the sunset they wash out
     instead of flipping into dark silhouettes */
  #driftlayer { position: fixed; inset: 0; pointer-events: none; mix-blend-mode: screen; }
  .drift { position: absolute; }
  .drift div {
    position: absolute; left: 50%; top: 50%;
    width: 100%; height: 34%;
    border: 1px solid rgba(246, 231, 201, 0.5);
    border-radius: 50%;
  }
  .drift div:first-child {
    transform: translate(-50%, -50%) rotate(14deg);
    animation: driftSway var(--dur, 8s) ease-in-out var(--del, 0s) infinite;
  }
  .drift div:last-child  {
    transform: translate(-50%, -50%) rotate(-14deg); border-color: rgba(246, 231, 201, 0.3);
    animation: driftSway2 var(--dur, 8s) ease-in-out var(--del, 0s) infinite;
  }
  @keyframes driftSway {
    0%, 100% { transform: translate(-50%, -50%) rotate(16deg); }
    50%      { transform: translate(-50%, -50%) rotate(-16deg); }
  }
  /* mirrored, not reversed: a symmetric rock played backwards is the same motion */
  @keyframes driftSway2 {
    0%, 100% { transform: translate(-50%, -50%) rotate(-16deg); }
    50%      { transform: translate(-50%, -50%) rotate(16deg); }
  }

  #scene { position: fixed; inset: 0; }

  .wordmark {
    position: fixed; left: 50%; top: 44%;
    transform: translate(-50%, -50%);
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(3rem, 9vw, 7.5rem);
    font-style: italic; letter-spacing: 0.04em; font-weight: 600;
    z-index: 30; pointer-events: none;
    text-shadow: 0 0 24px rgba(0, 0, 0, 0.9), 0 0 80px rgba(232, 137, 74, 0.45);
  }
  .scrim {
    position: fixed; left: 50%; top: 45%;
    transform: translate(-50%, -50%);
    width: min(72vw, 60rem); height: min(38vh, 22rem);
    background: radial-gradient(ellipse closest-side, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0.35) 55%, transparent 100%);
    z-index: 20; pointer-events: none;
  }
  .tagline {
    position: fixed; left: 50%; top: calc(44% + clamp(2.2rem, 6vw, 5rem));
    transform: translateX(-50%);
    font-size: clamp(0.8rem, 1.4vw, 1.05rem);
    font-style: italic; opacity: 0.65; letter-spacing: 0.12em;
    z-index: 30; pointer-events: none; white-space: nowrap;
  }

  /* the centre of a satellite hub: the satellite's own wordmark and lede */
  .subwordmark {
    position: fixed; left: 50%; top: 52%;
    transform: translate(-50%, -50%);
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(1.8rem, 4.6vw, 3.6rem);
    font-style: italic; font-weight: 600; letter-spacing: 0.04em;
    z-index: 30; pointer-events: none; white-space: nowrap;
    opacity: 0;
    text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 0 60px rgba(232, 137, 74, 0.4);
  }
  .subtagline {
    position: fixed; left: 50%; top: calc(52% + clamp(1.6rem, 3.4vw, 2.8rem));
    transform: translateX(-50%);
    width: min(34rem, 80vw); text-align: center;
    font-style: italic; font-size: clamp(0.78rem, 1.3vw, 1rem); line-height: 1.5;
    opacity: 0; letter-spacing: 0.08em;
    z-index: 30; pointer-events: none;
  }

  .ring, .ring2 {
    position: absolute; left: 50%;
    border: 12px solid rgba(246, 231, 201, 0.85);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    box-shadow:
      0 0 22px rgba(232, 137, 74, 0.45),
      0 0 60px rgba(232, 137, 74, 0.18),
      inset 0 0 22px rgba(232, 137, 74, 0.3);
  }
  .ring2 { border-color: rgba(246, 231, 201, 0.55); }
  /* the satellite's own ring is finer */
  .subring, .subring2 {
    position: absolute; left: 50%;
    border: 5px solid rgba(246, 231, 201, 0.8);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none; opacity: 0;
    box-shadow:
      0 0 16px rgba(232, 137, 74, 0.4),
      0 0 40px rgba(232, 137, 74, 0.15),
      inset 0 0 16px rgba(232, 137, 74, 0.25);
  }
  .subring2 { border-color: rgba(246, 231, 201, 0.5); }

  .node { position: absolute; text-align: center; cursor: pointer; }
  .node .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--cream);
    margin: 0 auto 8px;
    box-shadow: 0 0 12px rgba(246, 231, 201, 0.8);
  }
  .node .label {
    font-size: var(--label-size, 1rem); letter-spacing: 0.22em; text-transform: uppercase;
    font-family: Georgia, serif; white-space: nowrap;
    transition: text-shadow 0.25s;
  }
  .node:hover .label { text-shadow: 0 0 18px rgba(246, 231, 201, 0.9); }
  .node.subnode .dot { width: 7px; height: 7px; }
  .node.subnode .label { font-size: calc(var(--label-size, 1rem) * 0.78); }

  #front-desc {
    position: fixed; left: 50%; top: 78%;
    transform: translateX(-50%);
    width: min(34rem, 82vw);
    text-align: center; z-index: 30; pointer-events: none;
    color: var(--cream);
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6);
  }
  #front-desc .name {
    font-size: 1.25rem; letter-spacing: 0.3em; text-transform: uppercase;
    margin-bottom: 0.5rem; font-weight: bold;
  }
  #front-desc .desc { font-style: italic; font-size: 1rem; line-height: 1.5; opacity: 0.85; }


  /* a whispered instruction on arrival: fades in, lingers, and is gone */
  .introhint {
    position: fixed; bottom: 4%; left: 1.6rem;
    font-size: 0.72rem; letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--cream);
    background: rgba(0, 0, 0, 0.55);
    border: 2px solid rgba(246, 231, 201, 0.42);
    border-radius: 6px;
    padding: 0.8rem 1.2rem;
    box-shadow: 0 0 18px rgba(232, 137, 74, 0.25), inset 0 0 12px rgba(232, 137, 74, 0.12);
    z-index: 30; pointer-events: none;
    opacity: 0; white-space: nowrap;
    animation: hintcycle 7s ease-in-out 2.8s forwards;
  }
  @media (max-width: 520px) { .introhint { font-size: 0.6rem; left: 1rem; padding: 0.6rem 0.9rem; } }
  @keyframes hintcycle {
    0% { opacity: 0; }
    18% { opacity: 1; }
    78% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* ---------- language selection: a quiet chip in the top right corner ---------- */
  #langsel { position: fixed; top: 1.1rem; right: 1.6rem; z-index: 60; text-align: right; }
  #langcur {
    background: rgba(0, 0, 0, 0.55); cursor: pointer;
    border: 2px solid rgba(246, 231, 201, 0.42); border-radius: 6px;
    color: var(--cream); opacity: 0.85;
    font-family: Georgia, serif; font-size: 0.72rem; font-weight: 700;
    letter-spacing: 0.26em; text-transform: uppercase;
    padding: 0.55rem 0.7rem 0.55rem 0.95rem;
    transition: box-shadow 0.25s, opacity 0.25s;
  }
  #langcur:hover { opacity: 1; box-shadow: 0 0 18px rgba(232, 137, 74, 0.25); }
  #langmenu {
    display: none; margin-top: 0.5rem;
    background: rgba(0, 0, 0, 0.82);
    border: 2px solid rgba(246, 231, 201, 0.42); border-radius: 6px;
    overflow: hidden;
  }
  #langsel.open #langmenu { display: block; }
  /* one row specification for every tongue: same size, same weight, same height */
  #langmenu button {
    display: block; width: 100%; text-align: right; cursor: pointer;
    background: none; border: none; color: var(--cream); opacity: 0.75;
    font-family: Georgia, serif; font-size: 0.85rem; line-height: 1;
    padding: 0.65rem 1rem;
    border-bottom: 1px solid rgba(246, 231, 201, 0.1);
    border-right: 2px solid transparent;
    white-space: nowrap;
  }
  #langmenu button:last-child { border-bottom: none; }
  #langmenu button:hover { opacity: 1; }
  #langmenu button.active { opacity: 1; border-right-color: var(--sunrise); background: rgba(246, 231, 201, 0.05); }
  @media (max-width: 520px) {
    #langsel { right: 1rem; top: 0.9rem; }
    #langcur { font-size: 0.6rem; padding: 0.45rem 0.55rem 0.45rem 0.8rem; }
  }

  /* scripts outside the latin orbit: arabic joins its letters and devanagari
     stacks its signs, so tracking would tear them; none of the three carries
     an italic tradition, so the slant comes off for their display text */
  html[data-notrack] .node .label, html[data-notrack] .page-nav,
  html[data-notrack] #front-desc .name, html[data-notrack] .introhint,
  html[data-notrack] .p-toggle, html[data-notrack] .p-progress-note,
  html[data-notrack] .p-cat, html[data-notrack] .member .m-name { letter-spacing: normal; }
  html[data-noital] .subwordmark, html[data-noital] .subtagline,
  html[data-noital] .page-inner h1, html[data-noital] .page-lede,
  html[data-noital] #front-desc .desc, html[data-noital] .coming .c-title,
  html[data-noital] .member .m-status { font-style: normal; }

  /* phones: smaller title, tighter chrome, room for the rounder orbit */
  @media (max-width: 520px) {
    .wordmark { font-size: 2.1rem; }
    .tagline { font-size: 0.68rem; top: calc(44% + 1.9rem); }
    .subwordmark { font-size: 1.5rem; }
    .subtagline { font-size: 0.72rem; top: calc(52% + 1.4rem); }
    #front-desc .name { font-size: 0.95rem; }
    #front-desc .desc { font-size: 0.85rem; }
    .page-inner { padding-top: 24vh; }
    .page-inner h1 { font-size: 2rem; }
  }

  /* ---------- content pages ---------- */
  #page {
    position: fixed; inset: 0; z-index: 25;
    overflow-y: auto;
    opacity: 0; pointer-events: none;
  }
  .page-inner {
    max-width: 44rem;
    margin: 0 auto;
    padding: 30vh 1.5rem 6rem;
  }
  .page-inner h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic; font-weight: 600;
    font-size: clamp(2.4rem, 6vw, 4.2rem);
    margin-bottom: 1.2rem;
    text-shadow: 0 0 40px rgba(232, 137, 74, 0.35);
  }
  .page-lede {
    font-style: italic; font-size: 1.15rem; line-height: 1.65;
    opacity: 0.9; margin-bottom: 2rem;
  }
  .page-body p { line-height: 1.85; margin-bottom: 1.3rem; opacity: 0.78; }
  .page-nav {
    display: flex; justify-content: space-between;
    margin-top: 4.5rem;
    font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase;
  }
  .page-nav a { color: var(--cream); text-decoration: none; opacity: 0.7; }
  .page-nav a:hover { opacity: 1; }

  /* the arc overhead is always the way back up one level */
  #ringzone {
    position: fixed; top: 0; left: 0; right: 0; height: 30vh;
    z-index: 45; cursor: pointer; pointer-events: none;
  }

  /* ---------- listings ---------- */
  .member { margin-bottom: 1.1rem; }
  .member .m-name { letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.95rem; }
  .member .m-name a { color: var(--cream); text-decoration: none; transition: text-shadow 0.25s; }
  .member .m-name a:hover { text-shadow: 0 0 16px rgba(246, 231, 201, 0.9); }
  .member .m-tag { opacity: 0.5; font-size: 0.8em; margin-right: 0.15em; }
  .member .m-legal { opacity: 0.45; font-size: 0.8em; text-transform: none; letter-spacing: 0.05em; font-style: italic; }
  .member .m-status { font-style: italic; opacity: 0.6; font-size: 0.9rem; }

  .proj {
    border: 2px solid rgba(246, 231, 201, 0.42);
    border-radius: 6px;
    padding: 1.3rem 1.5rem;
    margin-bottom: 1.4rem;
    background: rgba(0, 0, 0, 0.25);
    display: flex; gap: 1.3rem; align-items: flex-start;
    /* cards run 75% wider than the text column, centred */
    width: min(175%, 88vw);
    margin-left: 50%; transform: translateX(-50%);
  }
  @media (max-width: 900px) { .proj { width: 100%; } }
  .p-media {
    flex: 0 0 78px; height: 78px;
    border: 1px solid rgba(246, 231, 201, 0.25); border-radius: 8px;
    background: rgba(0, 0, 0, 0.35);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  .p-media img { width: 100%; height: 100%; object-fit: cover; }
  /* until a logo is uploaded: a faint resting emblem */
  .p-media-ph { position: relative; width: 44px; height: 44px; }
  .p-media-ph div {
    position: absolute; left: 0; right: 0; top: 31%; height: 38%;
    border: 1px solid rgba(246, 231, 201, 0.35); border-radius: 50%;
  }
  .p-media-ph div:first-child { transform: rotate(16deg); }
  .p-media-ph div:last-child  { transform: rotate(-16deg); border-color: rgba(246, 231, 201, 0.2); }
  .p-inner { flex: 1; min-width: 0; }
  .proj .p-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.4rem; }
  .proj .p-name { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 1.3rem; }
  .proj .p-cat { font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.5; }
  .proj .p-desc { line-height: 1.7; opacity: 0.75; margin-top: 0.6rem; }
  /* a card's controls wear the pill of .p-links, so they read as controls;
     the caret turns over when the panel it names is open */
  .p-toggle {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: rgba(246, 231, 201, 0.06);
    border: 1px solid rgba(246, 231, 201, 0.4); border-radius: 999px;
    cursor: pointer;
    color: var(--cream); opacity: 0.8;
    font-family: Georgia, serif; font-size: 0.72rem;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 0.5rem 1.15rem; margin-top: 0.9rem;
    transition: opacity 0.25s, background 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .p-toggle::after {
    content: ''; flex: none; width: 0.4em; height: 0.4em;
    border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: translateY(-0.15em) rotate(45deg);
    transition: transform 0.3s ease;
  }
  .p-toggle[aria-expanded="true"]::after { transform: translateY(0.1em) rotate(-135deg); }
  .p-toggle[aria-expanded="true"] { opacity: 1; background: rgba(246, 231, 201, 0.12); border-color: rgba(246, 231, 201, 0.75); }
  .p-toggle:hover {
    opacity: 1; background: rgba(246, 231, 201, 0.12);
    border-color: var(--cream); box-shadow: 0 0 14px rgba(232, 137, 74, 0.35);
  }
  .p-toggle:focus-visible {
    /* the ring is the glow; the transparent outline keeps a mark in forced colours */
    outline: 2px solid transparent; outline-offset: 2px; opacity: 1;
    border-color: var(--cream); box-shadow: 0 0 0 2px rgba(232, 137, 74, 0.55);
  }
  .p-more {
    margin-top: 0.9rem; padding-top: 0.9rem;
    border-top: 1px solid rgba(246, 231, 201, 0.15);
    line-height: 1.75; opacity: 0.72; font-size: 0.95rem;
    white-space: pre-line;
  }
  .proj a { color: var(--sunrise); text-decoration: none; }
  .proj a:hover { text-decoration: underline; }
  .p-links { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.9rem; }
  .p-links a {
    border: 1px solid rgba(246, 231, 201, 0.4); border-radius: 999px;
    padding: 0.3rem 0.95rem;
    font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--cream); text-decoration: none;
    transition: box-shadow 0.25s, border-color 0.25s;
  }
  .p-links a:hover { border-color: var(--cream); box-shadow: 0 0 14px rgba(232, 137, 74, 0.35); text-decoration: none; }
  .p-progress { margin-top: 0.95rem; height: 4px; background: rgba(246, 231, 201, 0.15); border-radius: 999px; overflow: hidden; }
  .p-progress div { height: 100%; background: linear-gradient(90deg, var(--ember), var(--sunrise)); }
  .p-progress-note { font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5; margin-top: 0.4rem; }

  /* ---------- portal: chat + news ---------- */
  .portal input {
    width: 100%;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(246, 231, 201, 0.28);
    border-radius: 4px;
    color: var(--cream);
    font-family: Georgia, serif; font-size: 1rem;
    padding: 0.65rem 0.8rem;
    outline: none;
  }
  .portal input:focus { border-color: rgba(246, 231, 201, 0.7); }
  .portal .pbtn {
    background: none; cursor: pointer;
    border: 1px solid rgba(246, 231, 201, 0.5);
    border-radius: 999px;
    color: var(--cream);
    font-family: Georgia, serif;
    font-size: 0.78rem; letter-spacing: 0.22em; text-transform: uppercase;
    padding: 0.7rem 1.8rem;
    transition: box-shadow 0.25s, border-color 0.25s;
  }
  .portal .pbtn:hover { border-color: var(--cream); box-shadow: 0 0 24px rgba(232, 137, 74, 0.35); }
  .portal .pbtn[disabled] { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
  .portal-login { max-width: 26rem; }
  .portal-login .pbtn { margin-top: 1.2rem; }
  .pstatus { font-style: italic; font-size: 0.85rem; opacity: 0.7; margin-top: 0.8rem; }
  .psignout { font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.5; cursor: pointer; background: none; border: none; color: var(--cream); padding: 0; margin-bottom: 1.2rem; }
  .psignout:hover { opacity: 1; }

  /* ---------- the dashboard shell (once inside the portal) ---------- */
  .dash {
    display: flex;
    /* near-fullscreen: the workspace owns the viewport while the portal is open */
    position: fixed; top: 3.5vh; left: 3vw; right: 3vw; bottom: 3.5vh;
    z-index: 46;   /* above the arc and its exit zone */
    border: 2px solid rgba(246, 231, 201, 0.35);
    border-radius: 10px;
    background: #000;
    overflow: hidden;
  }
  .dash-side {
    width: 200px; flex: 0 0 200px;
    display: flex; flex-direction: column;
    border-right: 1px solid rgba(246, 231, 201, 0.15);
    background: rgba(0, 0, 0, 0.35);
    padding-top: 1.2rem;
  }
  .dash-brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic; font-weight: 600; font-size: 1.15rem;
    text-align: center; margin-bottom: 1.4rem;
    text-shadow: 0 0 24px rgba(232, 137, 74, 0.35);
  }
  .dash-nav { display: flex; flex-direction: column; }
  /* each tab a step deeper into the gradient, ruled apart by faint lines */
  #railnav > * { border-bottom: 1px solid rgba(246, 231, 201, 0.1); }
  #railnav > *:last-child { border-bottom: none; }
  /* one row specification for every rail row: same height, same weight, same voice */
  .dash-nav button, .grp-h {
    text-align: left; background: none; border: none; cursor: pointer;
    color: var(--cream); opacity: 0.82;
    font-family: Georgia, serif; font-size: 0.76rem; font-weight: 700;
    letter-spacing: 0.24em; text-transform: uppercase;
    padding: 1.05rem 1.4rem;
    border-left: 2px solid transparent;
    white-space: nowrap;
  }
  .dash-nav button:hover { opacity: 1; }
  .dash-nav button.active {
    opacity: 1;
    border-left-color: var(--sunrise);
    background: rgba(246, 231, 201, 0.05);
  }
  .dash-side { overflow-y: auto; }
  .grp-h { display: flex; justify-content: space-between; align-items: center; }
  .grp-h:hover { opacity: 1; }
  .grp-h > span:last-child { opacity: 0.55; font-size: 0.65rem; }
  .grp.closed .grp-b { display: none; }
  /* nested rooms hang off a bracket line, each ruled apart */
  .grp-b { margin-left: 1.35rem; border-left: 1px solid rgba(246, 231, 201, 0.2); }
  .grp-b button { border-bottom: 1px solid rgba(246, 231, 201, 0.07); }
  .grp-b button:last-child { border-bottom: none; }
  .dash-nav button.sub { padding: 0.8rem 1.1rem; width: 100%; opacity: 0.68; }
  .pdot {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--cream); opacity: 0.75; margin-right: 0.5rem; vertical-align: middle;
    box-shadow: 0 0 5px rgba(246, 231, 201, 0.8);
  }
  .pdot.director { background: #c05a86; box-shadow: 0 0 6px rgba(192, 90, 134, 0.9); }

<script>

  // ---------------- the portal: login gate, chat, news ----------------
  const escHtml = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  let portalMember = null;       // { handle, role } once signed in and seated

  function portalMount(kind) {
    setTimeout(() => initPortal(kind), 30);
    return '<div id="portalmount" class="portal"><p style="font-style:italic;opacity:.55">Opening the portal&hellip;</p></div>';
  }

  async function initPortal(kind) {
    const mount = document.getElementById('portalmount');
    if (!mount) return;
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { renderPortalLogin(mount, kind); return; }
    if (!portalMember) {
      const { data } = await sb.from('members').select('handle, role').eq('user_id', session.user.id).maybeSingle();
      portalMember = data || undefined;   // undefined = signed in, not seated
    }
    if (!portalMember) {
      mount.innerHTML =
        '<p>Signed in as ' + escHtml(session.user.email) + ', but this email holds no membership yet.</p>' +
        '<p style="font-style:italic;opacity:.6">Membership comes by application. The Apply satellite is open.</p>' +
        '<button class="psignout" onclick="portalSignOut(\'' + kind + '\')">Sign out</button>';
      return;
    }
    renderChat(mount);
  }

  function renderPortalLogin(mount, kind) {
    mount.innerHTML =
      '<div class="portal-login">' +
      '<p style="font-style:italic;opacity:.7;margin-bottom:1.2rem">The portal opens for members. Sign in with the email your membership carries.</p>' +
      '<input id="pmail" type="email" placeholder="you@example.com">' +
      '<div id="pcoderow" style="display:none;margin-top:0.8rem"><input id="pcode" maxlength="10" inputmode="numeric" placeholder="code from your email"></div>' +
      '<button class="pbtn" id="pgo" onclick="portalAuth(\'' + kind + '\')">Send code</button>' +
      '<div class="pstatus" id="pstatus"></div></div>';
  }

  async function portalAuth(kind) {
    const mail = document.getElementById('pmail').value.trim();
    const codeRow = document.getElementById('pcoderow');
    const status = document.getElementById('pstatus');
    const go = document.getElementById('pgo');
    if (codeRow.style.display === 'none') {
      if (!mail || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) { status.textContent = 'That email does not look complete.'; return; }
      go.disabled = true; go.textContent = 'Sending…';
      const { error } = await sb.auth.signInWithOtp({ email: mail, options: { shouldCreateUser: false } });
      go.disabled = false;
      if (error) { go.textContent = 'Send code'; status.textContent = 'Could not send the code — ' + error.message; return; }
      codeRow.style.display = '';
      go.textContent = 'Enter';
      status.textContent = 'A code is on its way to ' + mail + '.';
    } else {
      const code = document.getElementById('pcode').value.trim();
      if (code.length < 6) { status.textContent = 'That code looks too short.'; return; }
      go.disabled = true; go.textContent = 'Checking…';
      const { error } = await sb.auth.verifyOtp({ email: mail, token: code, type: 'email' });
      go.disabled = false;
      if (error) { go.textContent = 'Enter'; status.textContent = 'That code did not match — try again.'; return; }
      portalMember = null;
      initPortal(kind);
    }
  }

  // ----- rooms: All, Director + Execs, customs, and 1-to-1s -----

  function roomLabel(r) {
    if (r.kind === 'all') return 'All Chat';
    if (r.kind === 'officers') return 'BoardRoom';
    if (r.kind === 'forge') return 'The Forge';
    if (r.kind === 'custom') return r.name || 'Unnamed chat';
    const other = (roomPeeps[r.id] || []).find((u) => u !== portalUserId);
    const p = people.find((x) => x.user_id === other);
    return p ? p.handle : 'Direct chat';
  }

  async function renderChat(mount) {
    const { data: { session } } = await sb.auth.getSession();
    portalUserId = session.user.id;
    mount.innerHTML = dashShell('chat');
    const [mems, rms, peeps] = await Promise.all([
      sb.from('members').select('user_id, handle, role'),
      sb.from('rooms').select('*'),
      sb.from('room_members').select('room_id, user_id'),
    ]);
    people = mems.data || [];
    rooms = rms.data || [];
    roomPeeps = {};
    (peeps.data || []).forEach((x) => { (roomPeeps[x.room_id] = roomPeeps[x.room_id] || []).push(x.user_id); });
    buildRail();
    const home = rooms.find((r) => r.kind === 'all');
    if (home) openRoom(home.id);
    else document.getElementById('dashbody').innerHTML = '<p style="opacity:.5;font-style:italic">The chamber is unreachable — run the rooms migration.</p>';
    if (chatChannel) sb.removeChannel(chatChannel);
    chatChannel = sb.channel('chamber')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, (payload) => {
        if (!currentRoom || payload.new.room_id !== currentRoom.id) return;
        if (payload.eventType === 'INSERT') { if (chatMsgs.some((m) => m.id === payload.new.id)) return; chatMsgs.push(payload.new); }
        else if (payload.eventType === 'UPDATE') chatMsgs = chatMsgs.map((m) => (m.id === payload.new.id ? payload.new : m));
        paintChat();
      })
      .subscribe();
  }

  // folded/unfolded choices survive every rail rebuild
  const grpState = {};
  function toggleGrp(h, title) {
    const g = h.parentElement;
    g.classList.toggle('closed');
    grpState[title] = g.classList.contains('closed');
  }

  function buildRail() {
    const inRoom = (r) => (roomPeeps[r.id] || []).includes(portalUserId) || r.created_by === portalUserId;
    const rBtn = (r, sub) => '<button class="' + (sub ? 'sub' : '') + (currentRoom && currentRoom.id === r.id ? ' active' : '') + '" onclick="openRoom(\'' + r.id + '\')">' + escHtml(roomLabel(r)) + '</button>';
    const grp = (title, body, closed) => {
      if (!body) return '';
      const isClosed = title in grpState ? grpState[title] : !!closed;
      return '<div class="grp' + (isClosed ? ' closed' : '') + '"><div class="grp-h" onclick="toggleGrp(this, \'' + title + '\')"><span>' + title + '</span><span>&#9662;</span></div><div class="grp-b">' + body + '</div></div>';
    };
    const officers = roleRank[portalMember.role] >= 1;
    const mine = rooms.filter((r) => (r.kind === 'custom' || r.kind === 'dm') && inRoom(r));
    let rail =
      '<button class="' + (dashView === 'news' ? 'active' : '') + '" onclick="openNews()">News</button>' +
      rooms.filter((r) => r.kind === 'all').map((r) => rBtn(r, false)).join('') +
      (officers ? rooms.filter((r) => r.kind === 'officers').map((r) => rBtn(r, false)).join('') : '') +
      rooms.filter((r) => r.kind === 'forge').map((r) => rBtn(r, false)).join('') +
      grp('Custom Chats',
        mine.map((r) => rBtn(r, true)).join('') +
        '<button class="sub' + (dashView === 'create' ? ' active' : '') + '" onclick="newChatForm()">Create +</button>');
    if (isDirector()) {
      const unseen = rooms.filter((r) => (r.kind === 'custom' || r.kind === 'dm') && !inRoom(r));
      rail += grp('Oversight', unseen.map((r) => rBtn(r, true)).join(''), true);
    }
    rail += '<button class="' + (dashView === 'org' ? 'active' : '') + '" onclick="openOrgChart()">Org Chart</button>';
    const nav = document.getElementById('railnav');
    nav.innerHTML = rail;
    // one uniform plum for every tab; the rules carry the separation
    [...nav.children].forEach((el) => { el.style.background = '#2b1020'; });
  }

  // ----- org chart: the collective's structure; click a person to open the 1-to-1 -----
  function openOrgChart() {
    dashView = 'org'; currentRoom = null;
    document.getElementById('dashhead').textContent = 'Org Chart';
    const foot = document.querySelector('.dash-foot');
    if (foot) foot.style.display = 'none';
    const tier = (title, list) => list.length
      ? '<div class="org-tier"><div class="org-h">' + title + '</div>' + list.map((p) => {
          const me = p.user_id === portalUserId;
          return '<div class="org-p' + (me ? ' me' : '') + '"' + (me ? '' : ' onclick="openDm(\'' + p.user_id + '\')"') + '>' +
            '<span class="pdot ' + p.role + '"></span><span class="org-hdl">' + escHtml(p.handle) + '</span>' +
            (me ? '<span class="org-you">you</span>' : '') + '</div>';
        }).join('') + '</div>'
      : '';
    const byRole = { director: [], executive: [], member: [] };

      el.style.width = (2 * R * m2) + 'px';

      el.style.top = CY + 'px';
      el.style.transform = 'translate(-50%,-50%) rotate(' + lean + 'deg)';
      el.style.opacity = mainA;
    }

    let best = -1, bestDepth = -1;
    for (let i = 0; i < N; i++) {
      const a = rotShown + (i / N) * Math.PI * 2 + Math.PI / 2;
      const p = project(a, R, CX, CY, lean1);
      const el = nodes[i];
      const sc = (0.55 + p.depth * 0.75) * (1 + 0.35 * e);
      el.style.transform = 'translate(-50%,-50%) translate(' + p.x + 'px,' + p.y + 'px) scale(' + sc + ')';
      el.style.opacity = ((0.18 + p.depth * 0.82) * (e > 0 && i === currentIdx ? 1 : 1 - 0.25 * e)) * mainA;
      el.style.zIndex = p.depth > 0.5 ? 40 : 10;
      // depth-of-field blur smears small text on phones — desktop only
      el.style.filter = IS_MOBILE ? 'none' : 'blur(' + (1.6 * (1 - p.depth)) + 'px)';
      el.style.pointerEvents = (mainA > 0.5 && (zoomTarget === 0 || atTop)) ? 'auto' : 'none';
      if (p.depth > bestDepth) { bestDepth = p.depth; best = i; }
    }

    // ----- sub ring: satellite hub orbit -> overhead arc on an orbital page
    // hidden until the dive completes, then falls in (tiny -> full) like the landing page
    const subA = ((e > 0.96 || subIntro < 1) ? 1 : 0) * e * (orbital ? 1 : 0);
    const SR = lerp(RSUB, RPAGE, se) * (1 - 0.88 * subIntro);
    const SCY = lerp(CYSUB, CYPAGE, se);
    const subSwayAmp = lerp(10, 3, se);
    const slean1 = RING_TILT_DEG + subSwayAmp * Math.sin(swayPhase * 0.5 + 0.7);
    const slean2 = RING_TILT_DEG - subSwayAmp * Math.sin(swayPhase * 0.5 + 0.7);
    const sminor = 2 * SR * TILT;
    for (const [el, m2, lean] of [[subRing, 1, slean1], [subRing2, 1.012, slean2]]) {
      el.style.width = (2 * SR * m2) + 'px';
      el.style.height = (sminor * m2) + 'px';
      el.style.top = SCY + 'px';
      el.style.transform = 'translate(-50%,-50%) rotate(' + lean + 'deg)';
      el.style.opacity = subA;
    }
    if (orbital && subNodes.length) {
      const M = subNodes.length;
      for (let j = 0; j < M; j++) {
        const a = subRotShown + (j / M) * Math.PI * 2 + Math.PI / 2;
        const p = project(a, SR, CX, SCY, slean1);
        const el = subNodes[j];
        const sc = (0.55 + p.depth * 0.75) * (1 + 0.35 * se);
        el.style.transform = 'translate(-50%,-50%) translate(' + p.x + 'px,' + p.y + 'px) scale(' + sc + ')';
        el.style.opacity = ((0.18 + p.depth * 0.82) * (se > 0 && j === currentOrbIdx ? 1 : 1 - 0.25 * se)) * subA;
        el.style.zIndex = p.depth > 0.5 ? 41 : 11;
        el.style.filter = IS_MOBILE ? 'none' : 'blur(' + (1.6 * (1 - p.depth)) + 'px)';
        el.style.pointerEvents = (subA > 0.5 && (subZoomTarget === 0 || atTop)) ? 'auto' : 'none';
      }
    } else {
      for (const el of subNodes) { el.style.opacity = 0; el.style.pointerEvents = 'none'; }
    }

    // ----- background drifters
    for (const d of DRIFTERS) {
      d.x += d.speed;
      if (d.x > W + d.w) { d.x = -d.w * 1.5; d.y = Math.random() * H; }
      d.el.style.width = d.w + 'px';
      d.el.style.height = d.w + 'px';
      d.el.style.transform = 'translate(' + d.x + 'px,' + d.y + 'px)';
      // dissolve with altitude: fully gone before the sunset band (unless the
      // page-level darkening has swallowed the sunset, in which case fly free)
      const skyFade = Math.max(0, Math.min(1, (0.86 - (d.y + d.w) / H) / 0.14));
      d.el.style.opacity = d.o * lerp(skyFade, 1, Math.max(e, 0));
    }

    // ----- front description (home only)
    if (best >= 0 && zoomTarget === 0) {
      const b = SECTIONS[best];
      const bn = secName(b);
      if (frontName.textContent !== bn) {
        frontName.textContent = bn;
        frontDesc.textContent = secDesc(b);
      }
      const emph = Math.max(0, (bestDepth - 0.85) / 0.15);
      frontBox.style.opacity = (0.35 + emph * 0.65) * (1 - e) * (1 - intro);
    } else {
      frontBox.style.opacity = 0;
    }

    // ----- chrome fades
    // title gates: ease open once the relevant ring is 80% landed
    wmA += ((intro < 0.2 ? 1 : 0) - wmA) * 0.06;
    subWmA += ((subIntro < 0.2 ? 1 : 0) - subWmA) * 0.06;

    // home chrome is fully gone early in the dive; on the way back up it returns late
    const homeGate = zoomTarget === 0 ? 0.05 : 0.35;
    const homeA = (1 - Math.min(1, e / homeGate)) * wmA;
    darkenEl.style.opacity = e;
    blackoutEl.style.opacity = orbital ? se : 0;
    wordmark.style.opacity = homeA;
    tagline.style.opacity = 0.65 * homeA;
    scrimEl.style.opacity = homeA;
    // hub title lives while zoomed into a satellite hub, gone once an orbital opens
    const hubGate = subZoomTarget === 0 ? 0.05 : 0.35;
    const hubA = e * (orbital ? 1 : 0) * (1 - Math.min(1, se / hubGate)) * subWmA;
    subWordmark.style.opacity = hubA;
    subTagline.style.opacity = 0.75 * hubA;

    // content pages arrive only after the dive has fully settled
    const contentE = orbital ? se : e;
    const pageA = Math.max(0, (contentE - 0.8) / 0.2);
    pageEl.style.opacity = pageA;
    pageEl.style.pointerEvents = contentE > 0.9 ? 'auto' : 'none';
    // while the portal workspace is open, the arc is not an exit — leaving is explicit
    const dashOpen = !!document.querySelector('.dash');
    ringzoneEl.style.pointerEvents = (e > 0.8 && atTop && !dashOpen && (!orbital || se === 0 || se > 0.8)) ? 'auto' : 'none';
    // the workspace owns the viewport; the language chip yields to it
    langBox.style.visibility = dashOpen ? 'hidden' : '';

    requestAnimationFrame(frame);
  }

    // front position ~ cos(rot), so rightward input must DECREASE rot.

      const w = W * 0.6, h = H * 0.52, d = W * 0.3;
      const X = (x - 0.5) * w, Y = y * h, Z0 = (z - 0.5) * d;
      const x1 = X * Math.cos(yaw) - Z0 * Math.sin(yaw);
      const z1 = X * Math.sin(yaw) + Z0 * Math.cos(yaw);
      return [x1, Y * Math.cos(pitch) - z1 * Math.sin(pitch)];
    }
    function computeFit(W, H) {
      let nX = 1e9, xX = -1e9, nY = 1e9, xY = -1e9;
      for (const x of [-0.06, 0, 1, 1.05]) for (const y of [0, 1]) for (const z of [-0.12, 0, 1]) {
        const [px, py] = raw(x, y, z, W, H);
        nX = Math.min(nX, px); xX = Math.max(xX, px); nY = Math.min(nY, py); xY = Math.max(xY, py);
      }
      const SM = W < 520;
      const L = SM ? 44 : Math.min(60, W * 0.12), R = SM ? W * 0.12 : Math.min(120, W * 0.26), T = 14, B = 26;
      const s = Math.min((W - L - R) / Math.max(1, xX - nX), (H - T - B) / Math.max(1, xY - nY));
      fit = { s, ox: L + ((W - L - R) - (xX - nX) * s) / 2 - nX * s, oy: T + ((H - T - B) - (xY - nY) * s) / 2 + xY * s };
    }
    const P = (x, y, z, W, H) => { const [x1, y1] = raw(x, y, z, W, H); return [fit.ox + x1 * fit.s, fit.oy - y1 * fit.s]; };
    function span(lo, hi, target) {
      target = target || 5;
      if (hi <= lo) return { b: lo, t: hi, ticks: [] };
      const rough = (hi - lo) / target, mag = Math.pow(10, Math.floor(Math.log10(rough)));
      const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= rough);
      const b = Math.floor(lo / step) * step, t = Math.ceil(hi / step) * step, ticks = [];
      for (let v = b; v <= t + 1e-9; v += step) ticks.push(v);
      return { b, t, ticks };
    }
    function tip(x, y, text) {
      ctx.font = '600 12px "Segoe UI",sans-serif';
      const w = ctx.measureText(text).width;
      const tx = Math.min(Math.max(x + 14, 4), canvas.clientWidth - w - 14);
      const ty = Math.max(y - 30, 4);
      ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.strokeStyle = '#EFE7E1';
      ctx.beginPath(); ctx.roundRect(tx - 7, ty - 4, w + 14, 24, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = INK; ctx.fillText(text, tx, ty + 12);
    }
    const poly = (pts, close) => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); if (close) ctx.closePath(); };

    function drawLine2D(W, H) {
      const lo0 = Math.min(...NW.map((p) => p[1])), hi0 = Math.max(...NW.map((p) => p[1]));
      const head = Math.max(1, hi0 - lo0);
      const lo = lo0 - head * 0.18;
      const SM = W < 520;
      const sp = span(lo, hi0 + head * 0.12, SM ? 4 : 5);
      const hi = sp.t, padL = SM ? 46 : Math.min(62, W * 0.15), padR = SM ? 64 : Math.min(110, W * 0.24), padT = 22, padB = 30;
      const w = W - padL - padR, h = H - padT - padB;
      const X = (d) => padL + (d / (DAYS - 1)) * w, Y = (v) => padT + ((hi - v) / (hi - lo)) * h;
      ctx.font = '11px "Segoe UI",sans-serif';
      sp.ticks.filter((t) => t >= lo).forEach((t) => {
        ctx.strokeStyle = '#F5EFEA'; ctx.beginPath(); ctx.moveTo(padL, Y(t)); ctx.lineTo(padL + w, Y(t)); ctx.stroke();
        ctx.fillStyle = FAINT; ctx.textAlign = 'right'; ctx.fillText($$(t), padL - 8, Y(t) + 4);
      });
      ctx.textAlign = 'left';
      poly(NW.map((p) => [X(p[0]), Y(p[1])]).concat([[X(60), Y(lo)], [X(NW[0][0]), Y(lo)]]), true);
      ctx.fillStyle = 'rgba(198,58,15,.07)'; ctx.fill();
      poly(NW.map((p) => [X(p[0]), Y(p[1])]));
      ctx.strokeStyle = ORANGE; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.stroke(); ctx.lineWidth = 1;
      const end = [X(NW[NW.length - 1][0]), Y(NW[NW.length - 1][1])];
      ctx.fillStyle = ORANGE; ctx.beginPath(); ctx.arc(end[0], end[1], 4.5, 0, 7); ctx.fill();
      ctx.font = (SM ? '700 12px' : '700 14px') + ' "Segoe UI",sans-serif';
      ctx.fillText($$(NW[NW.length - 1][1]), end[0] + 10, end[1] + 4);
      ctx.font = '11px "Segoe UI",sans-serif'; ctx.fillStyle = FAINT;
      ctx.fillText(dayName(0) + ' 2026', padL, H - 8);
      ctx.textAlign = 'right'; ctx.fillText(dayName(60) + ' 2026', padL + w, H - 8); ctx.textAlign = 'left';
      if (hover) {
        let best = NW[0];
        NW.forEach((p) => { if (Math.abs(X(p[0]) - hover[0]) < Math.abs(X(best[0]) - hover[0])) best = p; });
        ctx.strokeStyle = 'rgba(156,143,135,.5)'; ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(X(best[0]), padT); ctx.lineTo(X(best[0]), padT + h); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#fff'; ctx.strokeStyle = ORANGE; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(X(best[0]), Y(best[1]), 4, 0, 7); ctx.fill(); ctx.stroke(); ctx.lineWidth = 1;
        tip(hover[0], hover[1], dayName(best[0]) + '  ' + $$(best[1], 1));
      }
    }

    function cashAxis(lo, hi, hOf, W, H, target) {
      const sp = span(lo, hi, target || (W < 520 ? 3 : 5));
      ctx.font = '10px "Segoe UI",sans-serif'; ctx.textAlign = 'right';
      sp.ticks.forEach((t) => {
        const y = hOf(t);
        poly([P(0, y, 0, W, H), P(1, y, 0, W, H), P(1, y, 1, W, H), P(0, y, 1, W, H)], true);
        ctx.strokeStyle = '#F0E8E2'; ctx.stroke();
        const a = P(-0.025, y, 0, W, H);
        ctx.fillStyle = FAINT; ctx.fillText($$(t), a[0], a[1] + 3);
      });
      ctx.textAlign = 'left';
      poly([P(0, hOf(sp.b), 0, W, H), P(0, hOf(sp.t), 0, W, H)]); ctx.strokeStyle = '#E5DCD5'; ctx.stroke();
      return sp;
    }
    function floorAndDates(W, H) {
      poly([P(0, 0, 0, W, H), P(1, 0, 0, W, H), P(1, 0, 1, W, H), P(0, 0, 1, W, H)], true);
      ctx.fillStyle = 'rgba(198,58,15,.025)'; ctx.fill(); ctx.strokeStyle = '#EFE7E1'; ctx.stroke();
      ctx.font = '11px "Segoe UI",sans-serif'; ctx.fillStyle = FAINT;
      const a = P(0.02, 0, -0.12, W, H), b = P(0.98, 0, -0.12, W, H);
      ctx.fillText(dayName(0), a[0], a[1]); ctx.textAlign = 'right'; ctx.fillText(dayName(60), b[0], b[1]); ctx.textAlign = 'left';
    }
    const depth = (z) => (z - 0.5) * Math.cos(yaw);
    const presence = (z) => 1 - (Math.cos(yaw) >= 0 ? z : 1 - z);
    const Z = (i, n) => n === 1 ? 0.5 : 1 - i / (n - 1);

    function drawTerrain(g, W, H) {
      floorAndDates(W, H);
      if (flat) {
        const m = span(0, g.maxDaily).t;
        cashAxis(0, g.maxDaily, (t) => t / m, W, H);
        const face = [P(0, 0, 0, W, H)];
        for (let d = 0; d < DAYS; d++) face.push(P(d / (DAYS - 1), g.totals[d] / m, 0, W, H));
        face.push(P(1, 0, 0, W, H));
        poly(face, true); ctx.fillStyle = 'rgba(198,58,15,.12)'; ctx.fill();
        ctx.strokeStyle = ORANGE; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke(); ctx.lineWidth = 1;
        if (hover) {
          let best = -1, bd = 18;
          for (let d = 0; d < DAYS; d++) {
            const dx = Math.abs(P(d / (DAYS - 1), g.totals[d] / m, 0, W, H)[0] - hover[0]);
            if (dx < bd) { bd = dx; best = d; }
          }
          if (best >= 0) {
            const a = P(best / (DAYS - 1), g.totals[best] / m, 0, W, H);
            ctx.fillStyle = '#fff'; ctx.strokeStyle = ORANGE; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.arc(a[0], a[1], 4, 0, 7); ctx.fill(); ctx.stroke(); ctx.lineWidth = 1;
            tip(hover[0], hover[1], dayName(best) + '  ' + $$(g.totals[best], 1));
          }
        }
        return;
      }
      const m = span(0, g.max).t, n = g.cats.length;
      [...Array(n).keys()].sort((a, b) => depth(Z(b, n)) - depth(Z(a, n))).forEach((c) => {
        const z = Z(c, n), pr = presence(z), pts = [P(0, 0, z, W, H)];
        for (let d = 0; d < DAYS; d++) pts.push(P(d / (DAYS - 1), g.spend[c][d] / m, z, W, H));
        pts.push(P(1, 0, z, W, H));
        poly(pts, true);
        ctx.fillStyle = 'rgba(198,58,15,' + (0.1 + 0.25 * pr) + ')'; ctx.fill();
        ctx.strokeStyle = 'rgba(198,58,15,' + (0.45 + 0.45 * pr) + ')'; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.stroke(); ctx.lineWidth = 1;
        if (W >= 520) { // small screens cede the labels to the cursor tips
          const a = P(1.03, 0, z, W, H);
          ctx.font = '10px "Segoe UI",sans-serif'; ctx.fillStyle = FAINT; ctx.fillText(g.cats[c].toUpperCase(), a[0], a[1]);
        }
      });
      cashAxis(0, g.max, (t) => t / m, W, H);
      if (hover) {
        let best = null, bd = 20;
        for (let c = 0; c < n; c++) for (let d = 0; d < DAYS; d++) {
          if (!g.spend[c][d]) continue;
          const p = P(d / (DAYS - 1), g.spend[c][d] / m, Z(c, n), W, H);
          const dist = Math.hypot(p[0] - hover[0], p[1] - hover[1]);
          if (dist < bd) { bd = dist; best = [c, d, p]; }
        }
        if (best) {
          ctx.fillStyle = '#fff'; ctx.strokeStyle = ORANGE; ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.arc(best[2][0], best[2][1], 4.5, 0, 7); ctx.fill(); ctx.stroke(); ctx.lineWidth = 1;
          tip(hover[0], hover[1], g.cats[best[0]] + '  ' + dayName(best[1]) + '  ' + $$(g.spend[best[0]][best[1]], 1));
        }
      }
    }

    function drawAccounts(W, H) {
      floorAndDates(W, H);
      const lo = 0, hi = span(0, Math.max(...NW.map((p) => p[1]))).t;
      cashAxis(lo, hi, (t) => t / hi, W, H);
      const series = ACCTS.map((a, i) => ({ name: a.name, pts: a.pts, z: i === 0 ? 0.6 : 1, bold: false }))
        .concat([{ name: 'Net worth', pts: NW, z: 0, bold: true }]);
      series.sort((a, b) => depth(b.z) - depth(a.z)).forEach((s) => {
        const pr = presence(s.z), al = s.bold ? 1 : 0.35 + 0.5 * pr;
        poly(s.pts.map((p) => P(p[0] / (DAYS - 1), p[1] / hi, s.z, W, H)));
        ctx.strokeStyle = 'rgba(198,58,15,' + al + ')'; ctx.lineWidth = s.bold ? 3 : 1.7; ctx.lineJoin = 'round'; ctx.stroke(); ctx.lineWidth = 1;
        const lp = s.pts[s.pts.length - 1], e = P(lp[0] / (DAYS - 1), lp[1] / hi, s.z, W, H);
        ctx.fillStyle = 'rgba(198,58,15,' + al + ')'; ctx.beginPath(); ctx.arc(e[0], e[1], s.bold ? 4.5 : 3, 0, 7); ctx.fill();
        ctx.font = (s.bold ? '700 13px' : '10px') + ' "Segoe UI",sans-serif';
        ctx.fillStyle = s.bold ? ORANGE : FAINT;
        ctx.fillText((W < 520 ? '' : s.name + '  ') + $$(lp[1]), Math.min(e[0] + 10, W - (W < 520 ? 66 : 150)), e[1] - 6);
      });
      if (hover) {
        let best = null, bd = 20;
        series.forEach((s) => s.pts.forEach((p) => {
          const q = P(p[0] / (DAYS - 1), p[1] / hi, s.z, W, H);
          const dist = Math.hypot(q[0] - hover[0], q[1] - hover[1]);
          if (dist < bd) { bd = dist; best = [s, p, q]; }
        }));
        if (best) {
          ctx.fillStyle = '#fff'; ctx.strokeStyle = ORANGE; ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.arc(best[2][0], best[2][1], 4.5, 0, 7); ctx.fill(); ctx.stroke(); ctx.lineWidth = 1;
          tip(hover[0], hover[1], best[0].name + '  ' + dayName(best[1][0]) + '  ' + $$(best[1][1], 1));
        }
      }
    }

    (function frame() {
      if (!slot.isConnected) return;
      if (Math.abs(yaw - tYaw) > 0.003 || Math.abs(pitch - tPitch) > 0.003) {
        yaw += (tYaw - yaw) * 0.16; pitch += (tPitch - pitch) * 0.16;
      } else { yaw = tYaw; pitch = tPitch; }
      const dpr = devicePixelRatio || 1, W = canvas.clientWidth, H = canvas.clientHeight;
      if (canvas.width !== W * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      canvas.style.cursor = view > 0 && !flat ? (drag ? 'grabbing' : 'grab') : 'crosshair';
      if (view === 0) drawLine2D(W, H);
      else { computeFit(W, H); if (view === 1) drawAccounts(W, H); else drawTerrain(view === 2 ? OUT : IN, W, H); }
      requestAnimationFrame(frame);
    })();
  }

  applyRoute();
  if (zoomTarget === 1) { zoom = 1; rot = rotTarget; }
  if (subZoomTarget === 1) { subZoom = 1; subRot = subRotTarget; }
  // the arrival whisper belongs to the home landing only — deep links skip it
  if (intro === 0) { const ih = document.querySelector('.introhint'); if (ih) ih.remove(); }
  frame();
</script>
</body>
</html>
