<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Aeternum: an A held by the crossed rings. Master vector; export any size. -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- the two rings, leaning against each other like the site's figure-8 sway -->
  <g filter="url(#glow)">
    <ellipse cx="256" cy="256" rx="228" ry="88"
             transform="rotate(16 256 256)"
             fill="none" stroke="#f6e7c9" stroke-width="10" stroke-opacity="0.9"/>
    <ellipse cx="256" cy="256" rx="228" ry="88"
             transform="rotate(-16 256 256)"
             fill="none" stroke="#f6e7c9" stroke-width="10" stroke-opacity="0.55"/>
  </g>

  <!-- the A -->
  <text x="256" y="256"
        text-anchor="middle" dominant-baseline="central"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-style="italic" font-weight="600" font-size="300"
        fill="#f6e7c9" filter="url(#glow)">A</text>
</svg>
